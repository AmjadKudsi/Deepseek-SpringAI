# Initialize DOM Elements, Define appendMessage and Create sendQuery

<!DOCTYPE html>
<html>
<head>
    <title>Your Personal Tutor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="header">
    <h1>Welcome to Your Personal Tutor</h1>
    <p>Ask any question and receive personalized guidance!</p>
</div>
<div id="chat-container">
    <div id="messages"></div>
    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="message-input" placeholder="Type your question...">
        </div>
        <button onclick="sendQuery()">Send</button>
        <button id="new-session-btn" onclick="startNewSession()">New Session</button>
    </div>
</div>

<script>
    // TODO: Initialize DOM elements for messagesContainer and messageInput
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');

    // TODO: Define the appendMessage function
    function appendMessage(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role);
        messageDiv.textContent = content;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // TODO: Define the sendQuery function
    function sendQuery() {
        const query = messageInput.value.trim();
        if (!query) return;

        appendMessage('user', query);
        messageInput.value = '';

        setTimeout(() => {
            appendMessage('assistant', 'You asked: ' + query);
        }, 500);
    }

</script>
</body>
</html>
