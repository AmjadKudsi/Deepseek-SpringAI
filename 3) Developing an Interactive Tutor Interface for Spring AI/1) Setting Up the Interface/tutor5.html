# create a startNewSession function that clears the message container and sets it to run automatically when the page loads

<!DOCTYPE html>
<html>
<head>
    <title>Your Personal Tutor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="header">
    <h1>Welcome to Your Personal Tutor</h1>
    <p>Ask any question and receive personalized guidance!</p>
</div>
<div id="chat-container">
    <div id="messages"></div>
    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="message-input" placeholder="Type your question...">
        </div>
        <button onclick="sendQuery()">Send</button>
        <button id="new-session-btn" onclick="startNewSession()">New Session</button>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');

    // TODO: Add an event listener for 'DOMContentLoaded' that calls startNewSession
    document.addEventListener('DOMContentLoaded', startNewSession);

    // TODO: Define the startNewSession function that clears all messages in the chat container
    function startNewSession() {
        messagesContainer.innerHTML = '';
    }    

    function sendQuery() {
        const query = messageInput.value.trim();
        if (!query) return;
        appendMessage('user', query);
        messageInput.value = '';
        setTimeout(() => {
            appendMessage('assistant', `You asked: ${query}`);
        }, 500);
    }

    function appendMessage(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        messageDiv.textContent = content;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendQuery();
        }
    });
</script>
</body>
</html>
